[package]
name = "bark-bolt-ffi"
version = "0.7.0"
edition = "2021"
license = "MIT"
authors = ["Team Second <hello@second.tech>"]
repository = "https://github.com/smolcars/bark-bolt-ffi"
description = "Swift and Kotlin bindings for the Bark wallet, using BoltFFI."

[lib]
name = "bark_bolt_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies.ark]
package = "ark-lib"
git = "https://gitlab.com/ark-bitcoin/bark"
rev = "959a489ff4934b181783b41c7d3ee68d85b95cbf"
default-features = false

[dependencies.bark]
package = "bark-wallet"
features = ["sqlite-bundled", "tls-webpki-roots", "native", "onchain-bdk", "bitcoind-rpc"]
git = "https://gitlab.com/ark-bitcoin/bark"
rev = "959a489ff4934b181783b41c7d3ee68d85b95cbf"
default-features = false

[dependencies.bark-bitcoin-ext]
package = "bark-bitcoin-ext"
git = "https://gitlab.com/ark-bitcoin/bark"
rev = "959a489ff4934b181783b41c7d3ee68d85b95cbf"
default-features = false

[dependencies]

# Wallet dependencies
bitcoin = { version = "0.32.7", features = ["serde", "rand", "rand-std"] }
bip39 = { version = "2.0.0", features = ["rand"] }
anyhow = { version = "1.0", features = ["backtrace"] }
async-trait = "0.1.83"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"
chrono = "0.4"
log = "0.4"
tokio = { version = "1.35", default-features = false, features = ["sync", "macros", "rt-multi-thread", "time"] }
futures-util = "0.3"

# Native FFI and persistence.
boltffi = "=0.31.1"
once_cell = "1.20"
rusqlite = { version = "0.31", features = ["backup"] }
tempfile = "3"
