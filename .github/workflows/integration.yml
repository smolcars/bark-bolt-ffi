name: Cross-platform RegTest acceptance
on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Unique ephemeral runner label supplied by ci-regtest-runner.py
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: macos-regtest
  cancel-in-progress: false
jobs:
  native-regtest:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && startsWith(inputs.runner_label, 'bark-bolt-regtest-')
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 120
    env:
      COMPOSE_PROJECT_NAME: bark-bolt-ffi-ci-${{ github.run_id }}
      BITCOIN_PORT: 19543
      ARK_PORT: 3735
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_BUILD_JOBS: 2
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/install-boltffi.sh
      - run: BOLTFFI="$PWD/target/tools/boltffi" just build-ios --overlay boltffi.local.toml
      - run: BOLTFFI="$PWD/target/tools/boltffi" just build-android --overlay boltffi.local.toml
      - run: just setup-everything
      - run: BARK_REGTEST=1 swift test --package-path tests/swift && BARK_REGTEST=1 ./gradlew :sdk:jvm:test :examples:android:assembleDebug
      - run: xcodegen generate --spec examples/ios/project.yml
      - name: Build and install both apps
        run: |
          xcodebuild -project examples/ios/BarkExample.xcodeproj -scheme BarkExample -sdk iphonesimulator -destination "platform=iOS Simulator,id=$IOS_DEVICE" -derivedDataPath build/ios build
          xcrun simctl install "$IOS_DEVICE" build/ios/Build/Products/Debug-iphonesimulator/BarkExample.app
          adb -s "$ANDROID_SERIAL" install -r examples/android/build/outputs/apk/debug/android-debug.apk
      - run: |
          set -o pipefail
          just test-regtest --extended | tee app-regtest-results.jsonl
      - if: always()
        run: just logs --tail=200 > regtest.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-platform-regtest-evidence
          retention-days: 3
          path: |
            app-regtest-results.jsonl
            regtest.log
      - if: always()
        run: just down --volumes
