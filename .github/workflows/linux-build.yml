name: Linux builds
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    # This definition is pinned in ci.yml and in the organization runner group.
    if: >-
      github.repository == 'smolcars/bark-bolt-ffi' &&
      contains(fromJSON('["rust", "android"]'), inputs.target) &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on:
      group: linux-blixt-europe
      labels: linux-blixt-europe
    environment: >-
      ${{ github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.full_name != github.repository ||
           !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)) &&
          'android-pr-build' || 'android-trusted-build' }}
    timeout-minutes: ${{ inputs.target == 'rust' && 30 || 90 }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 6
      CARGO_PROFILE_DEV_DEBUG: 0
      RUSTUP_TOOLCHAIN: 1.99.1
      BARK_PR_BUILD: ${{ github.event_name == 'pull_request' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use persistent project caches outside checkout cleanup
        run: |
          {
            echo "CARGO_HOME=$HOME/.cache/bark-bolt-ffi/cargo"
            echo "CARGO_TARGET_DIR=$HOME/.cache/bark-bolt-ffi/target"
            echo "GRADLE_USER_HOME=$HOME/.cache/bark-bolt-ffi/gradle"
          } >> "$GITHUB_ENV"
      - name: Check Rust and repository tooling
        if: inputs.target == 'rust'
        run: |
          nix develop --no-update-lock-file .#rust --command bash -euo pipefail <<'CHECKS'
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          python3 scripts/swift-artifact.py
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then python3 scripts/swift-artifact.py --check-source; fi
          python3 -m unittest discover -s tests/python -v
          shellcheck scripts/ark-dev.sh tests/shell/ark-dev.sh
          bash tests/shell/ark-dev.sh
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          CHECKS
      - name: Build SDKs, apps, and portable acceptance tests
        if: inputs.target == 'android'
        run: nix develop --no-update-lock-file .#android --command bash scripts/ci-android-build.sh
      - if: inputs.target == 'android'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-build
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: artifacts/android-build.tar.gz
      - if: failure() && inputs.target == 'android'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-build-failure-reports
          retention-days: 3
          path: |
            sdk/jvm/build/reports
            examples/android/build/reports
